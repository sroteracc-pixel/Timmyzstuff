# Builds (1) the payload library and (2) the patcher APK with the payload bundled inside it.
# NOT fully tested: the APK part worked for you; the payload part is new.
# If the payload step fails, the APK is still built (without a payload, so Install stays greyed out).
name: Build APK
on:
  workflow_dispatch:   # lets you press a "Run workflow" button
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build payload (arm64) with the Android NDK
        id: payload
        continue-on-error: true
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_ROOT}"
          echo "Using NDK at: $NDK"
          cmake -S payload -B payload/build \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-30 -DCMAKE_BUILD_TYPE=Release
          cmake --build payload/build
          file payload/build/libmain_payload.so
          mkdir -p app/src/main/assets/payload
          cp payload/build/libmain_payload.so app/src/main/assets/payload/libmain_payload.so

      - run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: Timmyzstuff-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: steps.payload.outcome == 'success'
        with:
          name: payload-libmain_payload-so
          path: payload/build/libmain_payload.so
